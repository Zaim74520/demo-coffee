<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Manrope', sans-serif; background: #2B1D16; color: #F5EDE0; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

  header { padding: 25px 0; background: rgba(43,29,22,0.95); position: sticky; top: 0; z-index: 10; }
  .header-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
  .logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: #C8956C; }
  nav a { margin-left: 25px; text-decoration: none; color: #F5EDE0; font-weight: 500; }
  nav a:hover { color: #C8956C; }

  .page-head { background: #3A2A20; text-align: center; padding: 50px 20px; }
  .page-head h1 { font-family: 'Playfair Display', serif; font-size: 42px; color: #C8956C; }

  .section { padding: 50px 0; }
  .contact-wrap { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
  .info { max-width: 380px; line-height: 2; font-size: 18px; }
  .info .label { color: #C8956C; font-weight: 700; }
  .info a { color: #F5EDE0; text-decoration: none; }
  .info a:hover { color: #C8956C; }

  .socials { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; }
  .social-link { display: inline-flex; align-items: center; gap: 8px; background: #3A2A20; padding: 12px 25px; border-radius: 8px; text-decoration: none; color: #F5EDE0; font-weight: 500; transition: all 0.3s; }
  .social-link:hover { background: #C8956C; color: #2B1D16; transform: translateY(-2px); }
  .social-link svg { width: 20px; height: 20px; fill: currentColor; }

  footer { background: #1F140F; text-align: center; padding: 30px 0; color: #B09A82; }
</style>
